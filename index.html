<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED TEAM — O Fim da Ordem Feudal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e10600;
    --red-dark: #8a0000;
    --red-deep: #4a0000;
    --red-glow: #ff2a1f;
    --ink: #0a0505;
    --paper: #f2ece4;
    --gray: #8a7d7d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.25rem;
    position: relative;
  }

  /* ===== FUNDO: linhas diagonais + grade sutil ===== */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        45deg,
        transparent 0,
        transparent 48px,
        rgba(225, 6, 0, 0.04) 48px,
        rgba(225, 6, 0, 0.04) 49px
      ),
      linear-gradient(180deg, #0a0505 0%, #140505 60%, #0a0505 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* vinheta vermelha de canto */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(225, 6, 0, 0.18), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(138, 0, 0, 0.15), transparent 70%),
      radial-gradient(ellipse 50% 50% at 0% 80%, rgba(225, 6, 0, 0.10), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== CONTAINER ===== */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 860px;
  }

  /* ===== TOPO: faixa de time ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.75rem;
    padding: 0 0.25rem;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    background: var(--red);
    display: grid;
    place-items: center;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    box-shadow: 0 0 24px rgba(225, 6, 0, 0.6);
    animation: markPulse 2.4s ease-in-out infinite;
  }

  @keyframes markPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(225, 6, 0, 0.5); }
    50% { box-shadow: 0 0 34px rgba(255, 42, 31, 0.9); }
  }

  .brand-mark svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }

  .brand-text .name {
    font-family: 'Anton', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
  }

  .brand-text .sub {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 3px;
    color: var(--red-glow);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .topbar-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 2px;
    color: var(--gray);
    text-transform: uppercase;
  }

  .topbar-meta .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red-glow);
    box-shadow: 0 0 12px var(--red-glow);
    animation: blink 1.4s steps(2, start) infinite;
  }

  @keyframes blink { to { opacity: 0.2; } }

  /* ===== CARD PRINCIPAL ===== */
  .panel {
    position: relative;
    background: linear-gradient(180deg, #140707 0%, #0c0404 100%);
    border: 1px solid rgba(225, 6, 0, 0.35);
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.9),
      0 30px 80px rgba(0, 0, 0, 0.8),
      0 0 100px rgba(225, 6, 0, 0.08);
  }

  /* barra superior vermelha do painel */
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--red) 20%, var(--red-glow) 50%, var(--red) 80%, transparent);
    box-shadow: 0 0 20px var(--red);
  }

  /* grade de fundo do painel */
  .panel-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(225, 6, 0, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(225, 6, 0, 0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  .panel-inner {
    position: relative;
    padding: 2.5rem 2.5rem 2rem;
  }

  /* ===== CABEÇALHO DA PERGUNTA ===== */
  .meta-row {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.6rem;
    flex-wrap: wrap;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--red-glow);
    border: 1px solid rgba(225, 6, 0, 0.5);
    padding: 0.35rem 0.7rem;
    background: rgba(225, 6, 0, 0.08);
  }

  .tag.ghost {
    color: var(--gray);
    border-color: rgba(138, 125, 125, 0.3);
    background: transparent;
  }

  .progress-track {
    flex: 1;
    height: 2px;
    background: rgba(255, 255, 255, 0.08);
    position: relative;
    min-width: 80px;
  }

  .progress-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 33.33%;
    background: linear-gradient(90deg, var(--red-dark), var(--red-glow));
    box-shadow: 0 0 12px var(--red);
    transition: width 0.5s ease;
  }

  .q-number {
    font-family: 'Anton', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1px;
    color: var(--gray);
  }

  .q-number strong { color: var(--red-glow); }

  /* ===== TEXTO DA PERGUNTA ===== */
  h1.question {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 4.5vw, 2.5rem);
    line-height: 1.15;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 0.75rem;
    text-wrap: balance;
  }

  h1.question em {
    font-style: normal;
    color: var(--red-glow);
    position: relative;
    white-space: nowrap;
  }

  h1.question em::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0.02em;
    height: 0.16em;
    background: var(--red);
    opacity: 0.35;
    z-index: -1;
  }

  .q-sub {
    font-size: 0.9rem;
    color: var(--gray);
    margin-bottom: 2.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .q-sub::before {
    content: "";
    width: 20px;
    height: 1px;
    background: var(--red);
  }

  /* ===== OPÇÕES ===== */
  .options {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    margin-bottom: 1.75rem;
  }

  .opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 1.15rem 1.4rem;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-left: 3px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    user-select: none;
    text-align: left;
    color: inherit;
    font-family: inherit;
  }

  .opt:hover:not(.locked) {
    background: rgba(225, 6, 0, 0.07);
    border-color: rgba(225, 6, 0, 0.4);
    border-left-color: var(--red);
  }

  .opt:focus-visible {
    outline: 2px solid var(--red-glow);
    outline-offset: 3px;
  }

  .opt .key {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.95rem;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--gray);
    transition: all 0.18s ease;
  }

  .opt:hover:not(.locked) .key {
    border-color: var(--red);
    color: var(--red-glow);
  }

  .opt .label {
    font-size: 1rem;
    line-height: 1.45;
    font-weight: 500;
    color: #d8cfcf;
    transition: color 0.18s ease;
  }

  .opt:hover:not(.locked) .label { color: #fff; }

  /* estado selecionado */
  .opt.picked {
    background: rgba(225, 6, 0, 0.12);
    border-color: var(--red);
    border-left-color: var(--red-glow);
  }

  .opt.picked .key {
    background: var(--red);
    border-color: var(--red-glow);
    color: #fff;
    box-shadow: 0 0 20px rgba(225, 6, 0, 0.55);
  }

  .opt.picked .label { color: #fff; }

  /* travado após responder */
  .opt.locked { cursor: default; }

  .opt.locked:not(.correct):not(.wrong) { opacity: 0.4; }

  /* resposta correta */
  .opt.correct {
    background: rgba(20, 90, 40, 0.18);
    border-color: #2fbf5b;
    border-left-color: #2fbf5b;
    animation: correctFlash 0.6s ease;
  }

  .opt.correct .key {
    background: #1a8a3e;
    border-color: #4dff88;
    color: #fff;
    box-shadow: 0 0 20px rgba(47, 191, 91, 0.6);
  }

  .opt.correct .label { color: #d9ffe4; }

  @keyframes correctFlash {
    0% { box-shadow: inset 0 0 0 0 rgba(47, 191, 91, 0.6); }
    100% { box-shadow: inset 0 0 0 40px rgba(47, 191, 91, 0); }
  }

  /* resposta errada */
  .opt.wrong {
    background: rgba(160, 0, 0, 0.15);
    border-color: var(--red-dark);
    border-left-color: var(--red);
  }

  .opt.wrong .key {
    background: var(--red-dark);
    border-color: var(--red);
    color: #ffc9c5;
  }

  .opt.wrong .label { color: #d8b0ad; }

  /* selo lateral nas respostas reveladas */
  .opt .marker {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0.25rem 0.55rem;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .opt.correct .marker { opacity: 1; color: #4dff88; border: 1px solid rgba(47,191,91,0.5); }
  .opt.wrong .marker { opacity: 1; color: #ff7b72; border: 1px solid rgba(225,6,0,0.5); }

  /* ===== BARRA DE AÇÃO ===== */
  .actions {
    display: flex;
    align-items: stretch;
    gap: 0.9rem;
    flex-wrap: wrap;
  }

  .status {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1.1rem;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.06);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 1px;
    color: var(--gray);
    line-height: 1.5;
  }

  .status .indicator {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    background: var(--gray);
    border-radius: 50%;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }

  .status.is-correct { border-color: rgba(47, 191, 91, 0.4); color: #b8f5c8; }
  .status.is-correct .indicator { background: #2fbf5b; box-shadow: 0 0 12px #2fbf5b; }
  .status.is-wrong { border-color: rgba(225, 6, 0, 0.5); color: #ffb3ae; }
  .status.is-wrong .indicator { background: var(--red-glow); box-shadow: 0 0 12px var(--red-glow); }

  .btn {
    font-family: 'Anton', sans-serif;
    font-size: 0.95rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 0 2rem;
    min-height: 52px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    position: relative;
  }

  .btn-primary {
    background: var(--red);
    color: #fff;
    box-shadow: 0 0 0 1px rgba(255, 42, 31, 0.5), 0 8px 30px rgba(225, 6, 0, 0.35);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--red-glow);
    box-shadow: 0 0 0 1px #ff6b60, 0 8px 40px rgba(255, 42, 31, 0.6);
    transform: translateY(-1px);
  }

  .btn-primary:active:not(:disabled) { transform: translateY(1px); }

  .btn-primary:disabled {
    background: #2a1515;
    color: #6b5555;
    box-shadow: none;
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    color: var(--gray);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    padding: 0 1.1rem;
    min-height: 52px;
    font-weight: 700;
  }

  .btn-ghost:hover {
    border-color: var(--red);
    color: var(--red-glow);
  }

  /* ===== RODAPÉ ===== */
  .footnote {
    margin-top: 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(138, 125, 125, 0.6);
    flex-wrap: wrap;
  }

  .footnote .sku { color: rgba(225, 6, 0, 0.7); }

  /* ===== RESPONSIVO ===== */
  @media (max-width: 640px) {
    .panel-inner { padding: 1.75rem 1.25rem 1.5rem; }
    .topbar { margin-bottom: 0.5rem; }
    .brand-text .name { font-size: 1.1rem; }
    .opt { padding: 0.95rem 1rem; gap: 0.9rem; }
    .opt .label { font-size: 0.92rem; }
    .opt .key { width: 30px; height: 30px; font-size: 0.82rem; }
    .actions { flex-direction: column; }
    .btn-primary { width: 100%; }
    .status { min-width: 0; }
    .q-sub { margin-bottom: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="stage">

  <!-- TOPO -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5 3.8 8.6 9 9 5.2-.4 9-4 9-9V7l-9-5zm0 4l5 2.8V13c0 3.3-2.2 5.9-5 6.4-2.8-.5-5-3.1-5-6.4V8.8L12 6z"/></svg>
      </div>
      <div class="brand-text">
        <span class="name">Red Team</span>
        <span class="sub">História · Módulo 03</span>
      </div>
    </div>
    <div class="topbar-meta">
      <span class="dot" aria-hidden="true"></span>
      <span>Sessão ativa</span>
    </div>
  </div>

  <!-- PAINEL -->
  <section class="panel" aria-label="Questão de múltipla escolha">
    <div class="panel-grid" aria-hidden="true"></div>
    <div class="panel-inner">

      <!-- META -->
      <div class="meta-row">
        <span class="tag">Questão 01</span>
        <span class="tag ghost">Múltipla escolha</span>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="q-number">NÍVEL <strong>MÉDIO</strong></span>
      </div>

      <!-- PERGUNTA -->
      <h1 class="question" id="questionText">
        Que duas mudanças contribuíram para <em>enfraquecer</em> a antiga ordem feudal?
      </h1>
      <p class="q-sub">Selecione a alternativa correta e confirme.</p>

      <!-- OPÇÕES -->
      <div class="options" id="options" role="radiogroup" aria-labelledby="questionText"></div>

      <!-- AÇÕES -->
      <div class="actions">
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="indicator" aria-hidden="true"></span>
          <span id="statusText">Aguardando seleção…</span>
        </div>
        <button class="btn btn-primary" id="confirmBtn" disabled>
          Confirmar
        </button>
        <button class="btn btn-ghost" id="resetBtn" aria-label="Reiniciar questão">
          ↺ Reset
        </button>
      </div>

    </div>
  </section>

  <!-- RODAPÉ -->
  <div class="footnote">
    <span>Red Team · Avaliação de Conhecimento</span>
    <span class="sku">REF. HIST-FEUDAL-01</span>
  </div>

</main>

<script>
(function () {
  "use strict";

  /* ========== DADOS ========== */
  const DATA = {
    correct: "B",
    options: [
      { key: "A", text: "A diminuição das cidades e do comércio." },
      { key: "B", text: "O crescimento das cidades e do comércio." },
      { key: "C", text: "O fim de todos os impostos." }
    ]
  };

  /* ========== ESTADO ========== */
  const state = {
    picked: null,     // "A" | "B" | "C" | null
    answered: false
  };

  /* ========== ELEMENTOS ========== */
  const optionsEl   = document.getElementById("options");
  const statusEl    = document.getElementById("status");
  const statusText  = document.getElementById("statusText");
  const confirmBtn  = document.getElementById("confirmBtn");
  const resetBtn    = document.getElementById("resetBtn");
  const progressFill= document.getElementById("progressFill");

  /* ========== RENDER ========== */
  function render() {
    optionsEl.innerHTML = "";

    DATA.options.forEach(function (opt) {
      const isPicked   = state.picked === opt.key;
      const isCorrect  = opt.key === DATA.correct;
      const showResult = state.answered;

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.dataset.key = opt.key;
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", isPicked ? "true" : "false");

      if (showResult) {
        btn.classList.add("locked");
        if (isCorrect) btn.classList.add("correct");
        else if (isPicked) btn.classList.add("wrong");
      } else if (isPicked) {
        btn.classList.add("picked");
      }

      btn.innerHTML =
        '<span class="key">' + opt.key + '</span>' +
        '<span class="label">' + opt.text + '</span>' +
        '<span class="marker">' +
          (showResult ? (isCorrect ? "Correta" : (isPicked ? "Sua escolha" : "")) : "") +
        '</span>';

      if (!showResult) {
        btn.addEventListener("click", function () { pick(opt.key); });
        btn.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pick(opt.key);
          }
        });
      }

      optionsEl.appendChild(btn);
    });

    /* barra de progresso: 33% → 66% (selecionado) → 100% (respondido) */
    if (state.answered) progressFill.style.width = "100%";
    else if (state.picked) progressFill.style.width = "66%";
    else progressFill.style.width = "33%";
  }

  /* ========== SELECIONAR ========== */
  function pick(key) {
    if (state.answered) return;
    state.picked = key;
    confirmBtn.disabled = false;
    setStatus("neutral", "Alternativa " + key + " selecionada. Confirme para verificar.");
    render();
  }

  /* ========== CONFIRMAR ========== */
  function confirm() {
    if (state.answered || !state.picked) return;

    state.answered = true;
    confirmBtn.disabled = true;

    const acertou = state.picked === DATA.correct;

    if (acertou) {
      setStatus("correct", "Correto — o crescimento urbano e comercial minou as bases feudais.");
    } else {
      const correta = DATA.options.find(function (o) { return o.key === DATA.correct; });
      setStatus("wrong", "Incorreto. A resposta certa é " + DATA.correct + ": \"" + correta.text + "\"");
    }

    render();
  }

  /* ========== RESET ========== */
  function reset() {
    state.picked = null;
    state.answered = false;
    confirmBtn.disabled = true;
    setStatus("neutral", "Aguardando seleção…");
    render();
    /* foco acessível na primeira opção */
    const first = optionsEl.querySelector(".opt");
    if (first) first.focus();
  }

  /* ========== STATUS ========== */
  function setStatus(kind, message) {
    statusEl.classList.remove("is-correct", "is-wrong");
    if (kind === "correct") statusEl.classList.add("is-correct");
    if (kind === "wrong")   statusEl.classList.add("is-wrong");
    statusText.textContent = message;
  }

  /* ========== EVENTOS ========== */
  confirmBtn.addEventListener("click", confirm);
  resetBtn.addEventListener("click", reset);

  /* Atalho: Enter confirma quando há seleção e botão habilitado */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !state.answered && state.picked && !confirmBtn.disabled) {
      if (document.activeElement && document.activeElement.classList.contains("opt")) return;
      e.preventDefault();
      confirm();
    }
  });

  /* ========== INIT ========== */
  render();

})();
